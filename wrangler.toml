# Cloudflare Pages 配置
# 作用：告诉 Pages「静态文件在 public/，函数在 functions/」
# 注意：D1 绑定建议在控制台配（Settings → Functions → D1 bindings），
#      下面的 d1_databases 段填了才生效，填错会导致构建失败，所以默认注释掉。

name = "juniorhighfriend"
pages_build_output_dir = "public"
compatibility_date = "2026-11-03"

# [[d1_databases]]
