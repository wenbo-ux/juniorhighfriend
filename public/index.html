<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#04060d">
<title>七年四班在朋友圈 · OUR 7 CLASS</title>
<style>
:root{
  --bg:#04060d;
  --panel:rgba(11,19,33,.62);
  --panel-2:rgba(8,14,26,.8);
  --line:rgba(120,185,255,.14);
  --line-2:rgba(120,185,255,.3);
  --ink:#e7f0fd;
  --dim:#8194b2;
  --dim-2:#556a8c;
  --cyan:#5fe3ff;
  --violet:#a08cff;
  --amber:#ffb648;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ---------- 科幻背景 ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
  radial-gradient(120% 80% at 50% -10%, #0b1a33 0%, #060b17 42%, #04060d 100%);}
#waves{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.bg-glow{position:absolute;left:50%;top:34%;width:min(120vw,760px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(90,170,255,.16) 0%, rgba(90,120,255,.07) 42%, transparent 68%);
  filter:blur(6px)}
.rings{position:absolute;left:50%;top:34%;width:1px;height:1px}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);
  border:1px solid rgba(130,180,255,.09)}
.r1{width:340px;height:340px;border-color:rgba(130,180,255,.11)}
.r2{width:520px;height:520px}
.r3{width:740px;height:740px;border-color:rgba(130,180,255,.06)}
.arc{position:absolute;left:50%;top:50%;width:600px;height:600px;transform:translate(-50%,-50%);
  animation:spin 46s linear infinite}
.arc circle{fill:none;stroke:rgba(170,215,255,.5);stroke-width:1.2;stroke-linecap:round;
  stroke-dasharray:1180 700;filter:drop-shadow(0 0 6px rgba(120,200,255,.5))}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.deco{position:fixed;z-index:1;font:10px/1.6 ui-monospace,"SF Mono",Menlo,monospace;
  letter-spacing:.32em;color:rgba(110,150,200,.45);text-transform:uppercase;pointer-events:none}
.deco.tl{left:22px;top:22px}
.deco.tr{right:22px;top:22px;text-align:right}
.deco.bl{left:22px;bottom:22px}
.deco.br{right:22px;bottom:22px;text-align:right}
.bracket{position:fixed;width:16px;height:16px;border:1px solid rgba(120,180,255,.22);z-index:1;pointer-events:none}
.bracket.a{left:16px;top:16px;border-right:0;border-bottom:0}
.bracket.b{right:16px;top:16px;border-left:0;border-bottom:0}
.bracket.c{left:16px;bottom:16px;border-right:0;border-top:0}
.bracket.d{right:16px;bottom:16px;border-left:0;border-top:0}
@media (max-width:820px){.deco,.bracket{display:none}}

/* ---------- 外壳 ---------- */
.app{position:relative;z-index:2;width:100%;max-width:560px;margin:0 auto;
  padding:0 15px 118px}

/* ---------- 顶栏 ---------- */
.nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 0 12px;
  background:linear-gradient(to bottom,rgba(4,6,13,.94) 58%,rgba(4,6,13,0));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav-side{display:flex;gap:8px}
.ic{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--line);background:rgba(13,22,38,.6);color:#b9cde7;
  backdrop-filter:blur(10px);transition:.18s}
.ic:active{transform:scale(.92)}
.ic:hover{border-color:var(--line-2);color:#fff}
.ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.brand{flex:1;min-width:0;text-align:center}
.brand b{display:block;font:600 12.5px/1.2 ui-monospace,"SF Mono",Menlo,monospace;
  letter-spacing:.28em;color:#dcecff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;margin-top:4px;font:9.5px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.3em;color:var(--dim-2)}
.exit{width:auto;padding:0 12px;border-radius:20px;gap:6px;display:flex;align-items:center;font-size:11.5px;
  letter-spacing:.1em;color:#93a9c6}
.exit svg{width:14px;height:14px}

/* ---------- 班级封面 ---------- */
.cover{position:relative;margin-top:4px;border:1px solid var(--line);border-radius:22px;
  overflow:hidden;padding:16px 16px 14px;min-height:118px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  background:
    linear-gradient(118deg,rgba(26,62,104,.62) 0%,rgba(46,30,92,.55) 52%,rgba(6,12,22,.72) 100%);
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.cover::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(140,200,255,.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(140,200,255,.09) 1px,transparent 1px);
  background-size:38px 38px;
  mask-image:radial-gradient(120% 100% at 90% 0%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(120% 100% at 90% 0%,#000 20%,transparent 78%)}
.cover::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,190,255,.28),transparent 62%);filter:blur(4px)}
.cover-main{position:relative;z-index:2}
.cover-kicker{font:9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.34em;color:rgba(160,205,255,.62);
  text-transform:uppercase}
.cover-name{margin-top:9px;font-size:21px;font-weight:700;letter-spacing:.06em;color:#fff;
  text-shadow:0 0 22px rgba(110,200,255,.45)}
.cover-sub{margin-top:6px;font-size:11.5px;color:#93a9c6;letter-spacing:.04em}
.cover-stats{position:relative;z-index:2;display:flex;gap:14px;text-align:right}
.cover-stats i{display:block;font-style:normal;font:600 17px/1 ui-monospace,Menlo,monospace;color:#dff2ff}
.cover-stats u{display:block;text-decoration:none;margin-top:5px;font-size:9.5px;letter-spacing:.16em;color:var(--dim-2)}
.emblem{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;
  color:#bfe9ff;border:1px solid rgba(120,200,255,.4);
  background:radial-gradient(circle,rgba(80,180,255,.22),rgba(6,14,26,.6));
  box-shadow:0 0 18px rgba(80,190,255,.35),inset 0 0 12px rgba(120,210,255,.2)}

/* ---------- 功能按钮 ---------- */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}
.btn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 5px 11px;
  border:1px solid var(--line);border-radius:15px;background:var(--panel);
  font-size:12.5px;letter-spacing:.02em;color:#cfdcef;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .16s,border-color .16s,background .16s,color .16s,box-shadow .16s}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.btn:hover{border-color:var(--line-2);background:rgba(20,38,62,.72);color:#fff;transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.on{color:var(--cyan);border-color:rgba(95,227,255,.42);
  background:rgba(18,52,74,.6);box-shadow:inset 0 0 26px rgba(95,227,255,.12),0 0 20px rgba(95,227,255,.08)}

/* ---------- 标题区 ---------- */
.sec{margin:26px 0 13px}
.kicker{display:flex;align-items:center;gap:9px;
  font:10px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.32em;
  color:var(--dim-2);text-transform:uppercase}
.kicker::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(120,185,255,.28),transparent)}
.title{margin:11px 0 0;font-size:31px;font-weight:800;letter-spacing:.05em;line-height:1.16;
  background:linear-gradient(100deg,#ffffff 0%,#c9ecff 38%,#b7b6ff 72%,#ffffff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 24px rgba(95,227,255,.22))}
.subline{margin-top:9px;display:flex;align-items:center;gap:10px;
  font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--dim-2)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--cyan)}
.live i{width:5px;height:5px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* ---------- 动态流 ---------- */
.feed{display:flex;gap:10px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.card{position:relative;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 14px 34px rgba(0,0,0,.38);transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);border-color:rgba(120,185,255,.28);
  box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 0 1px rgba(95,227,255,.06)}
.ph{position:relative;overflow:hidden;background:#070c16;line-height:0}
.ph svg{display:block;width:100%;height:auto}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to top,rgba(4,8,16,.82),rgba(4,8,16,0) 46%),
    repeating-linear-gradient(to bottom,rgba(180,225,255,.045) 0 1px,transparent 1px 3px)}
.ph-date{position:absolute;left:9px;top:9px;z-index:2;
  font:9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#d5ecff;
  padding:5px 7px;border-radius:6px;border:1px solid rgba(150,215,255,.28);
  background:rgba(6,14,26,.55);backdrop-filter:blur(6px)}
.ph-no{position:absolute;right:9px;top:9px;z-index:2;font:9px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.14em;color:rgba(170,215,255,.65)}
.body{padding:10px 11px 8px;min-width:0}
.who{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px;color:#c9d9ee;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .av{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-size:9px;color:#0a1424;background:linear-gradient(140deg,#7fe6ff,#8f8bff);
  box-shadow:0 0 10px rgba(120,200,255,.35)}
.who .dot{color:var(--dim-2)}
.cap{margin:7px 0 0;font-size:12px;line-height:1.55;color:#9fb2cb;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{display:flex;align-items:center;gap:4px;margin-top:9px;padding-top:8px;
  border-top:1px solid rgba(120,185,255,.1)}
.act{display:flex;align-items:center;gap:4px;padding:3px 6px;flex:0 0 auto;border-radius:8px;
  font:10.5px/1 ui-monospace,Menlo,monospace;color:#7186a6;transition:.16s}
.act svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.act:hover{color:#cfe6ff;background:rgba(120,185,255,.08)}
.act.on{color:#ff7fa8}
.act.on.star{color:var(--amber)}
.act.on svg{fill:currentColor}
.act .n{font-size:9.5px;letter-spacing:.02em}
.pinrow{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:9px;padding:6px 0;
  border-radius:9px;border:1px solid rgba(95,227,255,.26);background:rgba(95,227,255,.06);
  font:9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--cyan)}
.pinrow svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.pin{margin-left:auto;font:9px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--cyan);
  padding:4px 6px;border-radius:5px;border:1px solid rgba(95,227,255,.3);background:rgba(95,227,255,.08);
  white-space:nowrap}

/* 公示卡 */
.notice{border-color:rgba(255,182,72,.26);
  background:linear-gradient(168deg,rgba(40,29,13,.5) 0%,rgba(16,20,34,.72) 46%,rgba(9,14,25,.82) 100%)}
.notice::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;
  background:linear-gradient(to bottom,rgba(255,182,72,0),var(--amber),rgba(255,182,72,0));
  box-shadow:0 0 14px rgba(255,182,72,.6)}
.n-head{display:flex;align-items:center;gap:7px;padding:11px 11px 0;min-width:0}
.n-tag{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;color:#0a0f1c;
  padding:5px 8px;border-radius:5px;background:linear-gradient(120deg,#ffd089,#ffab3d);
  box-shadow:0 0 16px rgba(255,175,65,.35)}
.n-pin{margin-left:auto;font:9px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:rgba(255,190,110,.75)}
.n-body{padding:9px 11px 0}
.n-who{font-size:11px;color:#cbb489;letter-spacing:.04em}
.n-text{margin:7px 0 0;font-size:13px;line-height:1.62;color:#efe4d2}
.n-text b{color:#fff;font-weight:700;letter-spacing:.02em}
.n-warn{display:inline-block;margin-top:8px;font:600 11px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.2em;color:#ff9a4d;text-shadow:0 0 14px rgba(255,120,60,.55)}
.n-foot{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 11px 10px;
  border-top:1px solid rgba(255,182,72,.14);font:9.5px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.1em;color:#8d7f6c}
.n-foot .ok{color:#7fd7ff}

/* 底部 tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:10px 15px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(4,6,13,.97) 30%,rgba(4,6,13,.7) 64%,rgba(4,6,13,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs{width:100%;max-width:530px;display:flex;justify-content:space-around;align-items:center;
  border:1px solid var(--line);border-radius:20px;background:rgba(10,17,30,.82);
  padding:7px 4px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:5px 0 4px;border-radius:14px;color:#6d81a0;font-size:10.5px;letter-spacing:.08em;transition:.18s}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--cyan)}
.tab.active::before{content:"";position:absolute;top:-1px;width:20px;height:2px;border-radius:2px;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.tab:active{transform:scale(.95)}

/* 公告堆叠 / 置顶标记 */
#noticeFeed{display:flex;flex-direction:column;gap:10px}
#noticeFeed:empty{display:none}
.card[hidden]{display:none!important}
.card.pinned{border-color:rgba(95,227,255,.38);
  box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px rgba(95,227,255,.12)}
.pin-flag{position:absolute;right:8px;top:8px;z-index:3;
  font:8.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#061420;
  padding:4px 6px;border-radius:5px;background:linear-gradient(120deg,#8be9ff,#5fe3ff);
  box-shadow:0 0 14px rgba(95,227,255,.4)}

/* 评论抽屉 */
.c-mask{position:fixed;inset:0;z-index:70;display:none;background:rgba(2,5,10,.62);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.c-mask.on{display:block}
.c-sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;display:none;
  padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.c-sheet.on{display:block}
.c-in{max-width:540px;margin:0 auto;border:1px solid var(--line-2);border-radius:18px;overflow:hidden;
  background:linear-gradient(175deg,rgba(16,30,50,.99),rgba(7,12,22,.99));
  box-shadow:0 -18px 60px rgba(0,0,0,.6)}
.c-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
  font-size:12.5px;color:#cfe2f7;letter-spacing:.04em}
.c-hd b{font-weight:600}
.c-hd small{font:8.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--dim-2)}
.c-hd .sp{flex:1}
.c-close{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--line);color:#9db3d0}
.c-close svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.c-list{max-height:42vh;overflow:auto;padding:4px 0}
.c-item{display:flex;gap:9px;padding:9px 14px}
.c-item .av{width:26px;height:26px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  font-size:10px;color:#0a1424;background:linear-gradient(140deg,#7fe6ff,#8f8bff)}
.c-item .cb{flex:1;min-width:0;font-size:12px;line-height:1.6;color:#a9bdd8;word-break:break-word}
.c-item .cb b{display:block;font-size:10.5px;color:#d6e6f8;margin-bottom:3px;font-weight:600}
.c-item time{display:block;margin-top:3px;font:8.5px/1 ui-monospace,Menlo,monospace;color:var(--dim-2)}
.c-empty{padding:22px 14px;text-align:center;font-size:11.5px;color:#5f7397}
.c-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.c-form input{flex:1;min-width:0;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:rgba(4,10,20,.7);color:#e7f0fd;font-size:16px;outline:none}
.c-form input::placeholder{color:#4e6483}
.c-form input:focus{border-color:rgba(95,227,255,.45)}
.c-form button{padding:0 15px;border-radius:10px;border:1px solid rgba(95,227,255,.35);
  background:rgba(95,227,255,.1);color:var(--cyan);font-size:12px;letter-spacing:.08em}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  padding:9px 15px;border-radius:12px;border:1px solid rgba(120,185,255,.26);
  background:rgba(10,20,34,.94);backdrop-filter:blur(12px);
  font:11.5px/1 -apple-system,"PingFang SC",sans-serif;letter-spacing:.06em;color:#cfe6ff;
  box-shadow:0 12px 34px rgba(0,0,0,.5);transition:opacity .24s,transform .24s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 入场 */
.fade{animation:rise .55s cubic-bezier(.22,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .fade,.arc,.live i{animation:none}
}
@media (max-width:360px){
  .title{font-size:27px}
  .cover{padding:14px 13px 12px}
  .btn{font-size:11.5px;padding:10px 4px}
}
</style>

<body>

<!-- 背景 -->
<div class="bg" aria-hidden="true">
  <canvas id="waves"></canvas>
  <div class="bg-glow"></div>
  <div class="rings">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <svg class="arc" viewBox="0 0 600 600"><circle cx="300" cy="300" r="296"/></svg>
  </div>
</div>
<div class="deco tl">OUR 7 CLASS · FEED</div>
<div class="deco tr">UNIFIED CLASS LAYER</div>
<div class="deco bl">POWERED BY 七年四班</div>
<div class="deco br">ALL SYSTEMS NOMINAL</div>
<span class="bracket a"></span><span class="bracket b"></span>

<script>
/* ---------- 会话校验：没登录不许直接进 ---------- */
(function(){
  var s = null;
  try { s = JSON.parse(sessionStorage.getItem('c74_session') || 'null'); } catch(e){}
  if(!s || !s.id){ location.replace("auth.html"); }
})();

/* ---------- 背景：流线场 ---------- */
(function(){
  var cv = document.getElementById('waves');
  if(!cv) return;
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, t = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function frame(){
    if(!W || !H){ resize(); }
    ctx.clearRect(0, 0, W, H);
    var rows = 24, step = 7;
    for(var i = 0; i < rows; i++){
      var base = H * (i / (rows - 1));
      var amp = 9 + Math.sin(i * 0.72) * 6;
      ctx.beginPath();
      for(var x = -24; x <= W + 24; x += step){
        var k = x / (W || 1);
        var y = base
          + Math.sin(k * 6.4 + t * 0.32 + i * 0.42) * amp
          + Math.sin(k * 12.1 - t * 0.21 + i * 1.27) * amp * 0.44
          + Math.sin(k * 3.2 + t * 0.13) * 8;
        if(x === -24){ ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
      }
      var a = 0.085 + 0.09 * Math.abs(Math.sin(i * 0.8 + t * 0.1));
      ctx.strokeStyle = 'rgba(96,180,250,' + a.toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    /* 流动节点 */
    for(var d = 0; d < 6; d++){
      var px = ((t * (18 + d * 7) + d * 137) % (W + 120)) - 60;
      var py = H * (0.16 + 0.13 * d) + Math.sin(px / 90 + t * 0.5 + d) * 14;
      var g = ctx.createRadialGradient(px, py, 0, px, py, 12);
      g.addColorStop(0, 'rgba(150,225,255,' + (0.35 + 0.2 * Math.sin(t + d)) + ')');
      g.addColorStop(1, 'rgba(150,225,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, 12, 0, 6.2832); ctx.fill();
    }
    t += 0.016;
    if(!reduce){ requestAnimationFrame(frame); }
  }

  resize();
  window.addEventListener('resize', function(){ resize(); if(reduce) frame(); });
  frame();
})();

/* ---------- 轻交互 ---------- */
(function(){
  var toastEl = document.getElementById('toast'), timer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1700);
  }

  document.querySelectorAll('[data-toast]').forEach(function(b){
    b.addEventListener('click', function(){ toast(b.dataset.toast); });
  });

  /* 点赞 / 收藏 */
  document.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('.act.like, .act.star');
    if(!btn) return;
    var n = btn.querySelector('.n');
    if(!n) return;
    if(!btn.dataset.n) btn.dataset.n = String(parseInt(n.textContent,10)||0);
    var base = parseInt(btn.dataset.n, 10) || 0;
    var on = btn.classList.toggle('on');
    n.textContent = on ? base + 1 : base;
  });

  /* 锁定：状态在服务器，逻辑见 manage.js */

  /* 顶栏 */
  document.getElementById('search')?.addEventListener('click', function(){ toast('搜索：还没做'); });
  document.getElementById('back')?.addEventListener('click', function(){ toast('返回上一层'); });
  document.getElementById('exit')?.addEventListener('click', function(){
    try {
      sessionStorage.removeItem('c74_session');
      sessionStorage.removeItem('c74_admin_session');
      sessionStorage.removeItem('c74_undo_v1');
      localStorage.removeItem('c74_token');
      localStorage.removeItem('c74_me');
    } catch(e){}
    location.href = 'auth.html';
  });

  /* 底部 tab */
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(o){ o.classList.remove('active'); });
      tab.classList.add('active');
      var name = tab.dataset.tab;
      if(name === '我的'){
        if(window.C74Points) window.C74Points.close();
        if(window.C74Account) window.C74Account.open();
        else toast('账户面板还没准备好');
      } else if(name === '积分'){
        if(window.C74Points) window.C74Points.open();
        else toast('积分页还没准备好');
      } else {
        if(window.C74Points) window.C74Points.close();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });
})();
</script>
<script>
/* ---------- 与管理工作台共享的数据 / 评论 ---------- */
(function(){
  var KEY = 'c74_admin_v1';
  var db = null;
  try { db = (window.C74 && C74.load) ? C74.load() : JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
  var hasStore = !!(db && Array.isArray(db.posts));
  var session = {};
  try { session = JSON.parse(sessionStorage.getItem('c74_session') || '{}'); } catch(e) {}
  var me = session.name || session.id || '同学';

  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return n<10?'0'+n:''+n; }
  function stamp(){
    var d = new Date();
    return pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function save(){
    if(!hasStore) return;
    try { if(window.C74) C74.save(db); else localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}
  }

  /* 管理入口 */
  var adminBtn = document.getElementById('adminBtn');
  if(adminBtn) adminBtn.addEventListener('click', function(){ location.href = 'admin.html'; });

  /* ---------- 公告 ---------- */
  var feed = document.getElementById('noticeFeed');
  if(feed){
    if(hasStore && Array.isArray(db.notices) && db.notices.length){
      var notices = db.notices.slice().sort(function(a,b){ return (b.pinned?1:0)-(a.pinned?1:0); }).slice(0,3);
      feed.innerHTML = notices.map(function(n){
        var text = esc(n.text).replace(/\n/g,'<br>');
        return '<article class="card notice fade" data-nid="'+esc(n.id)+'">'+
          '<div class="n-head"><span class="n-tag">'+(n.urgent?'重要':'公示')+'</span>'+
          (n.pinned?'<span class="n-pin">PINNED · '+esc(n.author)+'</span>':'')+'</div>'+
          '<div class="n-body"><div class="n-who">'+esc(n.author)+'</div>'+
          '<p class="n-text">'+text+'</p>'+
          ((n.images && n.images.length)
            ? '<div class="n-imgs'+(n.images.length>1?' multi':'')+'">'+
              n.images.slice(0,3).map(function(u,i){ return '<img src="'+u+'" alt="图片'+(i+1)+'">'; }).join('')+
              '</div>'
            : '')+
          (n.urgent?'<span class="n-warn">重 要 ！ ！ ！</span>':'')+'</div>'+
          '<div class="n-foot"><span class="ok">已读 '+(n.reads||0)+' / '+(window.C74NoticeTotal||0)+'</span>'+
          '<span>· '+(n.pinned?'置顶':'公告')+'</span></div></article>';
      }).join('');
    }
  }

  /* ---------- 动态：隐藏 / 置顶 ---------- */
  var postMap = {};
  if(hasStore){
    db.posts.forEach(function(p){ postMap[p.id] = p; });
    $$('.card[data-post]').forEach(function(card){
      var p = postMap[card.getAttribute('data-post')];
      if(!p) return;
      if(p.hidden){ card.hidden = true; return; }
      if(p.pinned){
        card.classList.add('pinned');
        var flag = document.createElement('span');
        flag.className = 'pin-flag';
        flag.textContent = '置顶';
        card.appendChild(flag);
      }
    });
  } else {
    $$('.card[data-post]').forEach(function(card){
      postMap[card.getAttribute('data-post')] = { id: card.getAttribute('data-post'), comments: [] };
    });
  }

  /* 评论数 = 初始数字 + 新评论 */
  $$('.card[data-post]').forEach(function(card){
    var id = card.getAttribute('data-post');
    var p = postMap[id];
    var btn = card.querySelector('.act.cmt');
    var nEl = btn && btn.querySelector('.n');
    if(nEl && !nEl.dataset.base) nEl.dataset.base = nEl.textContent;
    if(p && nEl) nEl.textContent = (parseInt(nEl.dataset.base,10)||0) + (p.comments||[]).length;
  });

  /* ---------- 评论抽屉（不依赖管理数据，任何人都能用） ---------- */
  var mask = document.createElement('div');
  mask.className = 'c-mask';
  mask.id = 'cMask';
  var sheet = document.createElement('div');
  sheet.className = 'c-sheet';
  sheet.id = 'cSheet';
  sheet.innerHTML = '<div class="c-in">'+
    '<div class="c-hd"><b>评论</b><small id="cSub">COMMENTS</small><span style="flex:1"></span>'+
    '<button class="c-close" id="cClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
    '<div class="c-list" id="cList"></div>'+
    '<div class="c-form"><input id="cInput" maxlength="80" placeholder="说点什么…" autocomplete="off">'+
    '<button id="cSend">发送</button></div></div>';
  document.body.appendChild(mask);
  document.body.appendChild(sheet);

  var curPost = null;
  function currentCard(){
    return curPost ? document.querySelector('.card[data-post="'+curPost.id+'"]') : null;
  }
  function renderComments(){
    var box = $('#cList');
    if(!curPost){ box.innerHTML = ''; return; }
    var list = curPost.comments || [];
    $('#cSub').textContent = 'COMMENTS · ' + list.length;
    box.innerHTML = list.length ? list.map(function(c){
      return '<div class="c-item"><span class="av">'+esc(String(c.who||'?').charAt(0))+'</span>'+
        '<div class="cb"><b>'+esc(c.who)+'</b>'+esc(c.text)+'<time>'+esc(c.at)+'</time></div></div>';
    }).join('') : '<div class="c-empty">还没有人评论，来第一句</div>';
    box.scrollTop = box.scrollHeight;
  }
  function openComments(id){
    curPost = postMap[id];
    if(!curPost) return;
    if(!curPost.comments) curPost.comments = [];
    renderComments();
    mask.classList.add('on');
    sheet.classList.add('on');
  }
  function closeComments(){
    mask.classList.remove('on');
    sheet.classList.remove('on');
    curPost = null;
  }
  mask.addEventListener('click', closeComments);
  $('#cClose').addEventListener('click', closeComments);

  function refreshCount(){
    var card = currentCard();
    if(!card) return;
    var nEl = card.querySelector('.act.cmt .n');
    if(nEl) nEl.textContent = (parseInt(nEl.dataset.base,10)||0) + (curPost.comments||[]).length;
  }
  function send(){
    if(!curPost) return;
    var input = $('#cInput');
    var t = (input.value || '').trim();
    if(!t) return;
    curPost.comments.push({ who: me, text: t, at: stamp() });
    save();
    input.value = '';
    renderComments();
    refreshCount();
  }
  $('#cSend').addEventListener('click', send);
  $('#cInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); send(); }
  });

  document.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('.act.cmt');
    if(!btn) return;
    var card = btn.closest('[data-post]');
    if(card) openComments(card.getAttribute('data-post'));
  });

  /* 供上传模块登记新动态，保证评论可用 */
  window.C74Cmt = {
    register: function(p){ if(p && p.id){ postMap[p.id] = p; } },
    open: openComments
  };
})();
</script>
